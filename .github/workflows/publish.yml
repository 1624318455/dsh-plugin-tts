name: publish

# GitHub -> npm 自动发布：打 tag 即发包（先跑测试，绿了才 publish）。
# Release 说明取自 CHANGELOG.md 里对应版本的小节——发版前记得把「未发布」改成版本号。
# 发完 npm 后建 GitHub Release（body_path 指向抽取出的 release-notes.md）。
# 用法：npm version patch && git push --follow-tags
#   或：git tag v0.6.7 && git push --tags
# 前置（一次即可）：npmjs.com 打开本包 Settings -> Trusted Publisher，
#   选 GitHub Actions，填组织/用户 1624318455、仓库 dsh-plugin-tts、
#   workflow 文件名 publish.yml（environment 留空）。配好后无需任何 secret，
#   发布靠 OIDC 身份 + provenance 直发。

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 建 GitHub Release 需要
  id-token: write # npm provenance 需要

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Smoke + i18n + client-load + patch
        run: npm test && npm run test:i18n && npm run test:client && npm run test:patch

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 tag 历史，用于找上一个版本拼 Full Changelog 链接

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing 需要 npm >= 11.5.1（见 npm 文档）；
          # Node 22 自带 npm 10 不支持 OIDC，所以这里用 Node 24 并再显式升级 npm。
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest && npm --version

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Tag matches package.json version
        run: |
          node -e "const fs=require('fs');const v=require('./package.json').version;const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==tag){console.error('tag '+process.env.GITHUB_REF_NAME+' != package.json '+v);process.exit(1)}else{console.log('version ok: '+v)}"

      - name: Verify pack contents + privacy guard
        # 发布前最后一道闸：开发文件不许混进 tarball，仓库不许带本机/个人信息。
        run: npm run test:pack && npm run test:privacy

      - name: Extract release notes from CHANGELOG
        # 从 CHANGELOG.md 抽出当前版本小节。放 publish 之前：缺小节就整体失败，
        # 避免「npm 已发但 Release 页没说明」的半残状态。
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            $0 ~ ("^## " ver "([ \t].*)?$") { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 缺少 $GITHUB_REF_NAME 小节——发版前先写好更新点"
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME" >> release-notes.md
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        # tag 即 GITHUB_REF_NAME（v*），与前面校验过的 package.json.version 一致。
        # 说明来自上面的 extract 步骤（CHANGELOG.md 对应版本小节 + Full Changelog 链接）。
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
