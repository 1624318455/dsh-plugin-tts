name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Smoke + i18n + client-load + patch
        # live layer requires a real local rvc-server; it auto-SKIPs on CI when
        # ~/rvc-work / RVC_URL is absent, so it won't false-fail here.
        run: npm test && npm run test:i18n && npm run test:client && npm run test:patch

      - name: Live (optional, when RVC runtime available)
        run: npm run test:live
        continue-on-error: true
